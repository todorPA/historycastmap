<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%%meta_title%%</title>
    <meta name="description" content="%%meta_desc%%" />
    <meta property="og:title" content="%%meta_title%%" />
    <meta property="og:description" content="%%meta_desc%%" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/styles/landing.css" />
  </head>
  <body>
<!-- The landing page (docs/plans/2026-10-11-landing.md). Every data-i element is filled with its
     Serbian string at build time (vite.config.ts); the page script swaps in English. -->
<header class="hdr">
  <div class="hdr__in">
    <a class="brand" href="#arhiva" aria-label="HistoryCast Mapa istorije">
      <span class="logo"><img src="./img/landing/logo.webp" alt="" width="132" height="96"></span>
      <span class="brand__txt"><span class="brand__name">HistoryCast</span><span class="brand__sub" data-i="sub"></span></span>
    </a>
    <div class="lang" role="group" aria-label="Jezik / Language"><button type="button" data-lang="sr" aria-pressed="true">SR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
    <span class="hdr__sp"></span>
    <nav class="nav" id="nav" aria-label="Sadržaj">
      <a href="#arhiva" data-i="n1"></a>
      <a href="#autori" data-i="n2"></a>
      <a href="#statistika" data-i="n3"></a>
      <a href="#transkripti" data-i="n4"></a>
      <a href="#kako-radi" data-i="n5"></a>
    </nav>
    <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Meni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="btn btn--pri js-map" href="./app.html?lang=sr"><span class="l-long" data-i="open"></span><span class="l-short" data-i="open_s"></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</header>

<main>
<!-- 1 · ARHIVA -->
<section class="sec" id="arhiva" style="border-top:0">
  <div class="wrap hero">
    <div class="hero__copy">
      <p class="eyebrow" data-i="a_eye"></p>
      <h1 data-i="a_h"></h1>
      <p class="lead" data-i="a_lead"></p>
      <ul class="qs">
        <li><b data-i="q1k"></b><span data-i="q1"></span></li>
        <li><b data-i="q2k"></b><span data-i="q2"></span></li>
        <li><b data-i="q3k"></b><span data-i="q3"></span></li>
        <li><b data-i="q4k"></b><span data-i="q4"></span></li>
      </ul>
      <div class="prose">
        <p data-i="a_p1"></p>
        <p data-i="a_p2"></p>
      </div>
      <p class="credit" data-i="a_credit"></p>
    </div>
    <figure style="margin:0">
      <div class="plate" id="plate">
        <div class="frag" style="left:27.63%;top:0;width:72.37%;height:67.9%"><img data-img="a-map" src="./img/landing/a-map-sr.webp" alt="%%alt_a_map%%" data-alt="alt_a_map" width="1020" height="680"></div>
        <div class="frag" style="left:0;top:10.37%;width:31.58%;height:49.44%"><img data-img="a-panel" src="./img/landing/a-panel-sr.webp" alt="%%alt_a_panel%%" data-alt="alt_a_panel" width="656" height="730"></div>
        <div class="frag" style="left:10.53%;top:60.85%;width:89.47%;height:39.15%"><img data-img="a-tl" src="./img/landing/a-tl-sr.webp" alt="%%alt_a_tl%%" data-alt="alt_a_tl" width="2220" height="690"></div>
        <svg viewBox="0 0 760 540" aria-hidden="true">
          <rect x="3" y="283" width="234" height="38" rx="6" fill="none" stroke="#8A6620" stroke-width="2.5"/>
          <circle cx="369.6" cy="126.2" r="21" fill="none" stroke="#8A6620" stroke-width="2.5"/>
          <rect x="357" y="455" width="206" height="19" rx="5" fill="none" stroke="#8A6620" stroke-width="2.5"/>
          <path d="M237 297 C 300 290, 320 170, 350 140" fill="none" stroke="#8A6620" stroke-width="2" stroke-dasharray="5 5"/>
          <path d="M237 312 C 290 330, 330 420, 357 459" fill="none" stroke="#8A6620" stroke-width="2" stroke-dasharray="5 5"/>
        </svg>
        <span class="tag" style="left:16%;top:47.5%"><i>1</i><span data-i="t1"></span></span>
        <span class="tag" style="left:62%;top:91%"><i>2</i><span data-i="t2"></span></span>
        <span class="tag" style="left:48.6%;top:13.5%"><i>3</i><span data-i="t3"></span></span>
      </div>
      <figcaption class="plate__cap" data-i="a_cap"></figcaption>
    </figure>
  </div>
</section>

<!-- 2 · AUTORI -->
<section class="sec" id="autori">
  <div class="wrap">
    <div class="two">
      <div>
        <p class="eyebrow" data-i="p_eye"></p>
        <h2 data-i="p_h"></h2>
        <div class="prose" style="margin-top:18px">
          <p data-i="p_p1"></p>
          <p data-i="p_p2"></p>
        </div>
        <div class="layer" aria-label="Slojevi">
          <span data-i="l1"></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span class="on" data-i="l2"></span>
        </div>
      </div>
      <div>
        <ul class="people" id="people">
          <li class="person"><div class="ph" aria-hidden="true">NĐ</div><div><b>Nikola Đukić</b><span class="role" data-i="role_hist"></span></div></li>
          <li class="person"><div class="ph" aria-hidden="true">NŠ</div><div><b>Nikola Šipka</b><span class="role" data-i="role_hist"></span></div></li>
          <li class="person"><div class="ph" aria-hidden="true">ID</div><div><b>Ivan Drljača</b><span class="role" data-i="role_hist"></span></div></li>
          <li class="person"><div class="ph" aria-hidden="true">JM</div><div><b>dr Jovana Milovanović</b><span class="role" data-i="role_art_f"></span></div></li>
          <li class="person"><div class="ph" aria-hidden="true">MR</div><div><b>Mina Radovanović</b><span class="role" data-i="role_art_f"></span></div></li>
          <li class="person"><div class="ph" aria-hidden="true">NP</div><div><b>dr Nikola Piperski</b><span class="role" data-i="role_art_m"></span></div></li>
          <li class="person person--org"><div class="ph" aria-hidden="true"><img src="./img/landing/logo.webp" alt=""></div><div><b>PodMedia</b><span class="role" data-i="role_prod"></span></div></li>
        </ul>
        <p class="muted" style="margin-top:22px" data-i="p_note"></p>
      </div>
    </div>

    <div class="dist" id="raspodela">
      <div class="dist__h">
        <div>
          <h3 data-i="d_h"></h3>
          <div class="prose"><p data-i="d_p"></p></div>
        </div>
        <div class="seg" role="group" aria-label="Brojanje"><button type="button" data-unit="ep" aria-pressed="true"><span data-i="u_ep"></span> <span class="num" data-i="u_ep_n"></span></button><button type="button" data-unit="ch" aria-pressed="false"><span data-i="u_ch"></span> <span class="num" data-i="u_ch_n"></span></button></div>
      </div>
      <div class="chart" id="chart"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</section>

<!-- 3 · STATISTIKA -->
<section class="sec" id="statistika">
  <div class="wrap">
    <p class="eyebrow" data-i="s_eye"></p>
    <h2 data-i="s_h"></h2>
    <div class="stats">
      <div class="stat"><div class="stat__n num" data-i="s1n"></div><div class="stat__l" data-i="s1l"></div><div class="stat__d" data-i="s1d"></div></div>
      <div class="stat"><div class="stat__n num" data-i="s2n"></div><div class="stat__l" data-i="s2l"></div><div class="stat__d" data-i="s2d"></div></div>
      <div class="stat"><div class="stat__n num" data-i="s3n"></div><div class="stat__l" data-i="s3l"></div><div class="stat__d" data-i="s3d"></div></div>
    </div>
    <div class="grow">
      <div>
        <h3 data-i="g_h"></h3>
        <div class="prose"><p data-i="g_p"></p></div>
      </div>
      <figure class="spark" style="margin:0" id="spark"></figure>
    </div>
  </div>
</section>

<!-- 4 · TRANSKRIPTI -->
<section class="sec sec--deep" id="transkripti">
  <div class="wrap">
    <div class="tr-head">
      <div>
        <p class="eyebrow" data-i="r_eye"></p>
        <h2 data-i="r_h"></h2>
        <p class="lead" data-i="r_lead"></p>
      </div>
      <div class="markers" aria-label="Oznake na mapi">
        <div class="mk"><div class="mk__img"><img src="./img/landing/mk-ep.webp" alt="Oznaka epizode" width="72" height="72"></div><div><b data-i="m1"></b><span data-i="m1d"></span></div></div>
        <div class="mk"><div class="mk__img"><img src="./img/landing/mk-ch.webp" alt="Oznaka poglavlja" width="68" height="68"></div><div><b data-i="m2"></b><span data-i="m2d"></span></div></div>
      </div>
    </div>

    <ol class="steps">
      <li class="step">
        <div class="step__k"><i>1</i><span data-i="r1k"></span></div>
        <h3 data-i="r1h"></h3>
        <p data-i="r1p"></p>
        <div class="shot"><img data-img="t-search" src="./img/landing/t-search-sr.webp" alt="%%alt_t_search%%" data-alt="alt_t_search" width="656" height="354"></div>
      </li>
      <li class="step">
        <div class="step__k"><i>2</i><span data-i="r2k"></span></div>
        <h3 data-i="r2h"></h3>
        <p data-i="r2p"></p>
        <div class="shot"><img data-img="t-map" src="./img/landing/t-map-sr.webp" alt="%%alt_t_map%%" data-alt="alt_t_map" width="960" height="560"></div>
      </li>
      <li class="step">
        <div class="step__k"><i>3</i><span data-i="r3k"></span></div>
        <h3 class="num">▶ 12:48</h3>
        <p data-i="r3p"></p>
        <div class="shot"><img data-img="t-card" src="./img/landing/t-card-sr.webp" alt="%%alt_t_card%%" data-alt="alt_t_card" width="744" height="942"></div>
      </li>
    </ol>

    <ul class="vals">
      <li><b data-i="v1"></b><span data-i="v1d"></span></li>
      <li><b data-i="v2"></b><span data-i="v2d"></span></li>
      <li><b data-i="v3"></b><span data-i="v3d"></span></li>
      <li><b data-i="v4"></b><span data-i="v4d"></span></li>
    </ul>
    <p class="tr-note" data-i="r_note"></p>
  </div>
</section>

<!-- 5 · KAKO RADI -->
<section class="sec" id="kako-radi">
  <div class="wrap">
    <p class="eyebrow" data-i="h_eye"></p>
    <h2 data-i="h_h"></h2>
    <div class="how">
      <div class="app">
        <img data-img="app" src="./img/landing/app-sr.webp" alt="%%alt_app%%" data-alt="alt_app" width="1800" height="1125">
        <div class="zone" style="left:.3%;top:.4%;width:22.2%;height:99.2%"><span class="tag"><i>1</i><span data-i="z1"></span></span></div>
        <div class="zone" style="left:23%;top:.4%;width:76.7%;height:54.2%"><span class="tag"><i>2</i><span data-i="z2"></span></span></div>
        <div class="zone" style="left:23%;top:55.6%;width:76.7%;height:44%"><span class="tag"><i>3</i><span data-i="z3"></span></span></div>
        <div class="arrows" style="left:40%;top:80%"><span class="arr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg><span data-i="ah"></span></span><span class="arr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4"/></svg><span data-i="av"></span></span></div>
      </div>
      <ol class="parts">
        <li><h3><i>1</i><span data-i="h1"></span></h3><p data-i="h1p"></p></li>
        <li><h3><i>2</i><span data-i="h2"></span></h3><p data-i="h2p"></p></li>
        <li><h3><i>3</i><span data-i="h3"></span></h3><p data-i="h3p"></p>
          <div class="tlnav">
            <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg><span data-i="tn1"></span></div>
            <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4"/></svg><span data-i="tn2"></span></div>
            <div><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg><span data-i="tn3"></span></div>
          </div>
        </li>
      </ol>
    </div>
    <div class="flow" aria-label="Tok">
      <span data-i="f1"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span data-i="f2"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span data-i="f3"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span data-i="f4"></span>
    </div>
    <p class="sync" data-i="sync"></p>
  </div>
</section>

<!-- 6 · CTA -->
<section class="sec cta" id="mapa">
  <div class="wrap">
    <div class="logo"><img src="./img/landing/logo.webp" alt="HistoryCast" width="132" height="96"></div>
    <h2 data-i="c_h"></h2>
    <p data-i="c_p"></p>
    <a class="btn btn--pri btn--lg js-map" href="./app.html?lang=sr"><span data-i="open"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <p class="muted" data-i="c_lang"></p>
  </div>
</section>
</main>
<footer class="foot">
  <div class="wrap">
    <span data-i="ft1"></span>
    <span><a href="https://github.com/todorPA/historycastmap" target="_blank" rel="noreferrer" data-i="ft2"></a> · Natural Earth</span>
  </div>
</footer>

<script type="module" src="/src/landing/main.ts"></script>
</body>
</html>
