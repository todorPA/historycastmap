name: Test and deploy

on:
  push:
    branches: [main]
  # Pull requests run the same tests and build, so a failure shows on the PR before merging
  # instead of on main as a failed deploy. Nothing is published from a PR: the Pages steps and
  # the deploy job below are skipped for this event.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys share one group so a newer push supersedes an older one. Each PR gets its own group:
# with a single shared group, opening or updating a PR would cancel a deploy already running
# on main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same file a developer's nvm/fnm reads, so CI runs what local runs.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      # Gates the deploy. This workflow is what publishes the site on every push to main, so a
      # failing test here is the only thing that stops a broken data refresh from going live.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
